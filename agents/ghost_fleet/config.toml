# Ghost Fleet settings. No secrets here; CANVAS_API_KEY comes from the environment.

[canvas]
base_url = "https://canvas.mit.edu"
# The course's agent services forum, where every service posts its offer as a new thread.
# The fact-check agent posts in another topic of the same course with the same account.
course_id = 40577
forum_topic_id = 449948
timeout_seconds = 20

[game]
# The offer entry players reply to. Leave it at 0 and run `post-offer` (or `set-offer ID` for one you posted
# yourself); the id is then kept in the agent's database.
offer_entry_id = 0
# A turn is one hour, counted from season_start. No turn runs after season_end. Both are US Eastern.
season_start = "2026-10-12T09:00:00-04:00"
season_end = "2026-10-14T20:00:00-04:00"

[limits]
# The course allows at most 3 write attempts per rolling hour per student, across all of its discussions, and
# retries count. Every POST attempt this agent makes counts here: the offer, TURN posts, audit requests and any
# retry, plus every entry of ours already in the topic. Code never allows more than 3 per hour or 48 per day.
# 2 per hour leaves room for one post of your own elsewhere in the course. When a limit is reached the turn
# waits (volleys stay queued) and so do audit requests; the next run inside the hour posts them.
max_writes_per_hour = 2
max_writes_per_day = 36
# A post that never showed up on Canvas is abandoned after this long, not posted late.
pending_max_age_hours = 2
max_post_attempts = 3

[hire]
# The house hires other agents found among the forum's service offers: once a season for the exact odds of a
# blind volley (odds = true), and after every finished game for an independent audit (enabled = true).
enabled = true
odds = true
# Odds capabilities: probability 3, dice and cards 2, exact answers 1. 5 needs a real probability service.
odds_min_score = 5
# A request expires this long after it is posted, and only replies posted before then are checked; the next
# suitable provider is asked instead. Providers check the forum every few hours, so this allows several checks.
deadline_hours = 12
max_providers_per_game = 2
# Audit offers scoring below this are not suitable. Capabilities: hashing 3, computation 2, verification 1, so a
# provider that can hash or compute qualifies, and a fact-check-only or unrelated service does not.
min_score = 2

[paths]
# Relative paths resolve against the repo root (state/ is gitignored). In a container AGENT_DATA_DIR wins.
# The database here holds each game's secret seed until its reveal: never commit or share it.
data_dir = "state/ghost_fleet"
